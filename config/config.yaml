models:
  - bert-base-multilingual-cased
  - xlm-roberta-base
  

languages:
  - ar
  - es
  - ti

paths:
  shared_professions: data/shared/professions_en.txt
  arabic:
    corpus: data/arabic/corpus_ar.txt
    professions: data/arabic/professions_ar.csv
    anchors: data/arabic/anchors_ar.csv
  spanish:
    corpus: data/spanish/corpus_es.txt
    professions: data/spanish/professions_es.csv
    anchors: data/spanish/anchors_es.csv
  tigrigna:
    corpus: data/tigrigna/corpus_ti.txt
    professions: data/tigrigna/professions_ti.csv
    anchors: data/tigrigna/anchors_ti.csv

reduction:
  n_contexts: 10
  subword_pooling: mean
  context_aggregation: mean

filtering:
  min_frequency: 30

random_seed: 42

output:
  root: output
  save_layerwise: true
  save_wordlevel: true
